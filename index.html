<!DOCTYPE html>
<html>
<head>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* 🔝 HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #69966F;
  color: white;
  height: 60px;
  padding: 0 15px;
}

.logo {
  width: 40px;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

/* 🛒 GRID MODELOS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* 🧱 CARD */
.card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
}

.card h3 {
  font-size: 16px;
}

.card button {
  background: #69966F;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  cursor: pointer;
}

.card button:hover {
  background: #4f7c55;
}

.viewerContainer {
  display: none;
  position: relative;

  width: 100%;
  max-width: 1000px;   /* opcional para no estirarse demasiado */
  margin: auto;
}

/* el visor ya NO ocupa todo el alto */
model-viewer {
  width: 100%;
  height: auto;
  aspect-ratio: 16/9;  /* 🔥 clave */
  background: #111;
}

#imgViewer {
  width: 100%;
  height: auto;
  display: none;
}

/* 🟢 BOTONES VISTAS */
.views {
  position: absolute;
  right: 10px;
  top: 80px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.view-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #69966F;
  color: white;
  font-size: 10px;
  border: none;
  cursor: pointer;
}

/* 📱 MOBILE */
@media(max-width: 768px) {
  .views {
    right: 5px;
    top: 70px;
  }

  .view-btn {
    width: 45px;
    height: 45px;
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <div class="title">VISOR DE MODELOS 3D</div>
</div>

<h2 style="text-align:center;">SELECIONE UM MODELO</h2>

<!-- 🛒 MODELOS -->
<div class="grid" id="gridModelos"></div>

<!-- 🖥 VISOR -->
<div class="viewerContainer" id="viewerContainer">

  <model-viewer id="viewer3D" auto-rotate camera-controls></model-viewer>
  <img id="imgViewer">

  <div class="views" id="views"></div>

</div>

<script>
const modelos = {
  "CASA RODANTE 3,5 M": [
    "VISTA EXTERIOR.glb",
    "VISTA INTERIOR 1.glb",
    "VISTA INTERIOR 2.glb",
    "vista de panel.png"
  ],
  "TRAILER 4 METROS": [
    "TRAILER 4M VISTA EXTERIOR.glb",
    "TRAILER 4M INTERIOR VIAJE.glb",
    "TRAILER 4M DESCANSO.glb",
    "TRAILER 4M APERTURAS.glb"
  ],
  "TRAILER 4,5METROS": [
    "TRAILER 4,5M EXTERIOR.glb",
    "TRAILER 4,5M VIAJE.glb",
    "TRAILER 4,5M DESCANSO.glb",
    "TRAILER 4,5M APERTURAS.glb"
  ]
};

const grid = document.getElementById("gridModelos");
const viewerContainer = document.getElementById("viewerContainer");
const viewer3D = document.getElementById("viewer3D");
const imgViewer = document.getElementById("imgViewer");
const views = document.getElementById("views");

/* 🛒 CREAR TARJETAS */
for (let modelo in modelos) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="preview.PNG">
    <h3>${modelo}</h3>
    <button onclick="abrirModelo('${modelo}')">
      VER VISTAS DO MODELO
    </button>
  `;

  grid.appendChild(card);
}

/* 👁 ABRIR MODELO */
function abrirModelo(modelo) {
  viewerContainer.style.display = "block";
  views.innerHTML = "";

  const archivos = modelos[modelo];

  archivos.forEach((file, index) => {
    const btn = document.createElement("button");
    btn.className = "view-btn";
    btn.innerText = "Vista " + (index + 1);

    btn.onclick = () => mostrarArchivo(modelo, file);

    views.appendChild(btn);
  });

  // cargar primero
  mostrarArchivo(modelo, archivos[0]);
}

/* 📂 MOSTRAR */
function mostrarArchivo(carpeta, archivo) {
  const ruta = carpeta + "/" + archivo;

  if (archivo.endsWith(".glb")) {
    viewer3D.style.display = "block";
    imgViewer.style.display = "none";
    viewer3D.src = ruta;
  } else {
    viewer3D.style.display = "none";
    imgViewer.style.display = "block";
    imgViewer.src = ruta;
  }
}
</script>

</body>
</html>
